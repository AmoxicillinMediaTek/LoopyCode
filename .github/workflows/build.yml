name: Build

# Compiles LoopyCode (https://github.com/AmoxicillinMediaTek/LoopyCode).
# The engines under app/src/main/jniLibs are gitignored, so this checks that the
# Kotlin/Compose app itself compiles and packs; it does not produce a shippable
# apk. Build those with engine/build-*.sh first if you need the real thing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload the apk
        uses: actions/upload-artifact@v4
        with:
          name: loopycode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
